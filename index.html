<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop Login Mock</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { border: 1px solid #ccc; padding: 20px; max-width: 300px; border-radius: 5px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { color: red; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="text" id="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            
            <button type="submit">Log In</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            if (!email || !password) {
                message.textContent = 'Error: Fields cannot be empty.';
                return;
            }
            if (!email.includes('@')) {
                message.textContent = 'Error: Invalid email format.';
                return;
            }
            if (password.length < 8) {
                message.textContent = 'Error: Password must be at least 8 characters.';
                return;
            }

            // VULNERABLE LINE: intentionally using innerHTML to allow XSS
            message.innerHTML = 'Welcome, ' + email + '!'; 
        });
    </script>
</body>
</html>
